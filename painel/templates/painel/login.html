<!doctype html>
<html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Entrar | Cesar Veículos</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"><style>
:root{--navy:#142238;--red:#e23b36;--muted:#778397}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 12%,#2c4569 0,#172942 38%,#101b2c 78%);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#1d2939}.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.auth-card{width:min(100%,430px);background:#fff;border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:38px;box-shadow:0 28px 90px rgba(0,0,0,.28)}.brand-mark{width:50px;height:50px;background:var(--red);color:white;border-radius:15px;display:grid;place-items:center;margin:0 auto 18px;font-size:21px}.auth-card h1{text-align:center;font-size:24px;font-weight:800;margin:0}.auth-card p{text-align:center;color:var(--muted);margin:8px 0 28px;font-size:13px}.form-label{font-size:12px;font-weight:700;color:#44536a}.form-control{padding:12px 14px;border-radius:10px;border-color:#dce3ec;font-size:14px}.form-control:focus{border-color:#e98a85;box-shadow:0 0 0 .2rem rgba(226,59,54,.12)}.btn-login{background:var(--red);border:0;color:#fff;padding:12px;border-radius:10px;font-weight:700}.btn-login:hover{background:#c72f2a;color:#fff}.credit-footer{text-align:center;color:#9aa5b4;font-size:11px;margin-top:12px}.auth-footer{text-align:center;color:#9aa5b4;font-size:11px;margin-top:24px}.auth-kicker{text-align:center;text-transform:uppercase;letter-spacing:.13em;color:var(--red);font-weight:800;font-size:10px;margin-bottom:8px}
</style></head><body><main class="auth-wrap"><section class="auth-card"><div class="brand-mark"><i class="fa-solid fa-car-side"></i></div><div class="auth-kicker">Cesar Veículos · Gestão</div><h1>Acesse o painel</h1><p>Entre com sua conta para administrar a loja.</p>
{% if form.errors %}<div class="alert alert-danger py-2 small" role="alert"><i class="fa-solid fa-circle-exclamation me-2"></i>Usuário ou senha inválidos. Confira os dados e tente novamente.</div>{% endif %}
<form method="post">{% csrf_token %}<div class="mb-3"><label for="id_username" class="form-label">Usuário</label><input id="id_username" type="text" name="username" class="form-control" placeholder="Seu usuário" autocomplete="username" required autofocus></div><div class="mb-4"><label for="id_password" class="form-label">Senha</label><input id="id_password" type="password" name="password" class="form-control" placeholder="Sua senha" autocomplete="current-password" required></div><button type="submit" class="btn btn-login w-100">Entrar no painel <i class="fa-solid fa-arrow-right ms-2"></i></button></form><div class="auth-footer">Acesso restrito à equipe administrativa</div></section><footer class="credit-footer">Desenvolvido por P2T Digital</footer></main></body></html>
